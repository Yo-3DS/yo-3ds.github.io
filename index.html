<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo-3DS Website</title>
    <meta name="description" content="Yo-3DS Official Website. Discover my translation projects and more there!">

    <!-- Indications SEO pour Google sur les versions linguistiques -->
    <link rel="canonical" href="https://github.io">
    <link rel="alternate" hreflang="en" href="https://github.io">
    <link rel="alternate" hreflang="fr" href="https://github.io">
    <link rel="alternate" hreflang="x-default" href="https://github.io">

    <!-- Script de redirection immédiate selon la langue du navigateur -->
    <script>
        (function() {
            // Récupère la langue principale du navigateur (ex: "fr-FR", "fr", "en-US")
            var userLang = navigator.language || navigator.userLanguage || "en";
            
            // Vérifie si la langue commence par "fr"
            if (userLang.toLowerCase().startsWith("fr")) {
                window.location.replace("/fr/accueil/");
            } else {
                window.location.replace("/home/");
            }
        })();
    </script>

    <!-- Solution de secours si JavaScript est désactivé (redirige vers l'anglais après 2 secondes) -->
    <noscript>
        <meta http-equiv="refresh" content="2;url=/home/">
    </noscript>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        a {
            color: #4da6ff;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <p>Redirecting... / Redirection en cours...</p>
    <p>
        <a href="/home/">English</a> | 
        <a href="/fr/accueil/">Français</a>
    </p>
</body>
</html>
